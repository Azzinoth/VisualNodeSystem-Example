name: Pages

on:
  push:
    branches: [ "multi-backend" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 6.0.12

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Configure CMake
      run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build-web

    - name: Prepare site
      run: |
        mkdir site
        cp build-web/Visual_Node_System_Example.js build-web/Visual_Node_System_Example.wasm site/
        cp build-web/Visual_Node_System_Example.html site/index.html

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
