<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<title>VisualNodeSystem example</title>
	<style>
		html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#canvas { display: block; width: 100%; height: 100%; }
		#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; color: #ddd; font: 16px/1.5 sans-serif; text-align: center; white-space: pre-wrap; pointer-events: none; }
	</style>
</head>
<body>
	<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
	<div id="status">Loading...</div>
	<script>
		var StatusElement = document.getElementById("status");
		var bHasWebGPU = !!navigator.gpu;

		function ShowStatus(Text)
		{
			StatusElement.textContent = Text;
			StatusElement.style.display = "flex";
		}

		function ShowError(Details)
		{
			ShowStatus("The example stopped because of an error. Details are in the browser console." + (Details ? "\n\n" + Details : ""));
		}

		var Module = {
			canvas: document.getElementById("canvas"),
			onRuntimeInitialized: function () { if (bHasWebGPU) StatusElement.style.display = "none"; },
			onAbort: function (What) { ShowError(String(What)); }
		};

		window.addEventListener("error", function (Event) { ShowError(Event.message); });

		if (!bHasWebGPU)
		{
			Module.noInitialRun = true;
			ShowStatus("This example needs WebGPU, which this browser does not support or has turned off. Try a recent version of Chrome or Edge.");
		}
		else
		{
			navigator.gpu.requestAdapter().then(function (Adapter) {
				if (Adapter)
					return;

				bHasWebGPU = false;
				ShowStatus("This example could not find a GPU it can use with WebGPU. Your GPU or driver might not be supported, or hardware acceleration might be turned off in the browser.");
			});
		}
	</script>
	{{{ SCRIPT }}}
</body>
</html>
